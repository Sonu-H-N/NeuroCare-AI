<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NeuroScan AI — Alzheimer's Prediction System</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/main.css"/>
<link rel="stylesheet" href="css/components.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="loading-overlay" id="loadingOverlay" style="display:none">
  <div class="loading-box">
    <div class="loading-spinner"></div>
    <div class="loading-title">Analysing Risk Profile</div>
    <div class="loading-sub" id="loadingMsg">Processing biomarkers...</div>
    <div class="loading-progress"><div class="loading-bar" id="loadingBar" style="width:0%"></div></div>
  </div>
</div>

<nav id="mainNav">
  <div class="nav-inner">
    <div class="nav-brand">
      <div class="brand-icon">N</div>
      <div>
        <div class="brand-name">NeuroScan<span>AI</span></div>
        <div class="brand-sub">Alzheimer's Prediction System</div>
      </div>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showPage('home')">🏠 Assessment</button>
      <button class="nav-tab" onclick="showPage('education')">📚 Learn</button>
      <button class="nav-tab" onclick="showPage('history')">📋 History</button>
      <button class="nav-tab" onclick="showPage('about')">ℹ️ About</button>
    </div>
    <div class="nav-actions">
      <div class="status-indicator"><div class="status-dot"></div><span>AI Ready</span></div>
      <button class="icon-btn" onclick="promptAccessCode()" title="Set access code (only needed if the server requires one)">🔑</button>
      <button class="icon-btn" onclick="toggleDark()" id="darkBtn">🌙 Dark</button>
    </div>
  </div>
</nav>

<div id="page-home" class="page active"></div>
<div id="page-results" class="page"></div>
<div id="page-education" class="page"></div>
<div id="page-history" class="page"></div>
<div id="page-about" class="page"></div>

<footer class="main-footer">
  <div class="footer-inner">
    <span class="footer-brand">NeuroScan AI v2.0</span>
    <span class="footer-sep">·</span>
    <span>For educational &amp; research purposes only</span>
    <span class="footer-sep">·</span>
    <span>Not a substitute for medical diagnosis</span>
    <span class="footer-sep">·</span>
    <span>Powered by Claude AI (Anthropic)</span>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/scoring.js"></script>
<script src="js/charts.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/export.js"></script>
<script src="js/history.js"></script>
<script src="js/pages/home.js"></script>
<script src="js/pages/results.js"></script>
<script src="js/pages/education.js"></script>
<script src="js/pages/about.js"></script>
<script src="js/app.js"></script>
</body>
</html>
